[profile.default]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
src = "contracts"
test = "test"
out = "out"
libs = [".forge-deps"]
remappings = [
  "@openzeppelin/contracts/=.forge-deps/openzeppelin-contracts/contracts/",
  "forge-std/=.forge-deps/forge-std/src/",
]
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }
# Deploy script writes its record to ./deployments; the local deploy-script
# harness reads real Uniswap V3 / Permit2 bytecode from ./.uniswap-artifacts.
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./.uniswap-artifacts" },
]

[fmt]
line_length = 120
