name: Deploy MPGR Swap Executor (Base Mainnet)

# DEDICATED deployment workflow for contracts/swap/MPGRSwapExecutor.sol.
# The legacy deploy-executor-base-mainnet.yml (contracts/executor/MPGRExecutor.sol)
# is NEVER reused by this workflow and cannot deploy this contract.
#
# Trigger: add the `deploy-swap-base-mainnet` label to a PR from THIS repository.
# No workflow_dispatch, no push trigger. Fork PRs are rejected.
#
# Job 1 `gates` (no secrets): config pins, unit/fork swap suites, and a full
#   LOCAL anvil rehearsal of the exact forge script (simulate + broadcast to
#   127.0.0.1 only) followed by independent on-chain pin checks.
# Job 2 `deploy` runs in GitHub environment `base-mainnet`, which carries
#   required reviewers: the job WAITS for human approval before starting.
#   It broadcasts once, re-verifies every fee/governance pin on-chain, writes
#   the deployment manifest as an ARTIFACT and comments on the PR.
#
# Routing activation is a SEPARATE, later human step: committing the reviewed
# manifest into lib/swap/swap-executor-config.ts. This workflow never edits
# app config, never merges, and never touches production gates or secrets.
#
# Configuration (environment `base-mainnet`, values set by the owner, not here):
#   secret   SWAP_BASE_MAINNET_DEPLOYER_PRIVATE_KEY  dedicated nonce-0 key
#   variable SWAP_EXECUTOR_OWNER                     governance multisig address
# Optional: secret BASE_MAINNET_RPC_URL (defaults to https://mainnet.base.org),
#           secret ETHERSCAN_API_KEY (Basescan verification).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-swap-executor-base-mainnet
  cancel-in-progress: false

jobs:
  gates:
    if: >-
      github.event.label.name == 'deploy-swap-base-mainnet' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Solidity dependencies (pinned, same as CI)
        run: |
          mkdir -p .forge-deps
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
          git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Gate - committed config opens the swap gate exactly once
        run: |
          set -euo pipefail
          F=deployments/base-mainnet/deploy-config.json
          jq -e '.chainId == 8453 and .swapExecutorDeployEnabled == true' "$F" >/dev/null
          test ! -f deployments/base-mainnet/mpgr-swap-executor.json || { echo "::error::Swap executor manifest already exists - refusing a second deployment"; exit 1; }
      - name: Gate - swap contract suites
        run: |
          set -euo pipefail
          forge build --force
          forge test --match-path 'test/swap/*' --summary
      - name: Gate - rehearse the exact forge script on a LOCAL anvil fork
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
        run: |
          set -euo pipefail
          FORK_BLOCK=""
          for a in 1 2 3 4 5 6; do FORK_BLOCK="$(cast block-number --rpc-url "$BASE_MAINNET_RPC_URL" 2>/dev/null || true)"; [ -n "$FORK_BLOCK" ] && break; sleep $((a * 3)); done
          [ -n "$FORK_BLOCK" ] || { echo "::error::could not read Base Mainnet block number"; exit 1; }
          anvil --fork-url "$BASE_MAINNET_RPC_URL" --fork-block-number "$FORK_BLOCK" --port 8545 --retries 10 --fork-retry-backoff 2000 --timeout 60000 > anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill $ANVIL_PID 2>/dev/null || true' EXIT
          LOCAL=http://127.0.0.1:8545
          for _ in $(seq 1 120); do [ "$(cast chain-id --rpc-url "$LOCAL" 2>/dev/null || true)" = "8453" ] && break; sleep 1; done
          KEY="0x$(openssl rand -hex 32)"; echo "::add-mask::${KEY}"
          ADDR="$(cast wallet address --private-key "$KEY")"
          cast rpc anvil_setBalance "$ADDR" 0x2386F26FC10000 --rpc-url "$LOCAL" >/dev/null
          export BASE_MAINNET_DEPLOYER_PRIVATE_KEY="$KEY" MPGR_SWAP_EXECUTOR_DEPLOY_ENABLED=true
          export SWAP_EXECUTOR_OWNER="${SWAP_EXECUTOR_OWNER:-$ADDR}"
          S=script/DeployMPGRSwapExecutorBaseMainnet.s.sol:DeployMPGRSwapExecutorBaseMainnet
          forge script "$S" --rpc-url "$LOCAL" -vv > rehearse-sim.txt 2>&1
          rm -f deployments/base-mainnet/mpgr-swap-executor.json
          forge script "$S" --rpc-url "$LOCAL" --broadcast --slow -vv > rehearse-bc.txt 2>&1
          EXEC="$(jq -r .executor deployments/base-mainnet/mpgr-swap-executor.json)"
          [ "$(cast call "$EXEC" 'feeBps()(uint16)' --rpc-url "$LOCAL")" = "25" ]
          [ "$(cast call "$EXEC" 'MAX_FEE_BPS()(uint16)' --rpc-url "$LOCAL")" = "100" ]
          [ "$(cast call "$EXEC" 'FEE_TIMELOCK_SECONDS()(uint48)' --rpc-url "$LOCAL")" = "172800" ]
          [ "$(cast call "$EXEC" 'pendingEffectiveAt()(uint48)' --rpc-url "$LOCAL")" = "0" ]
          [ "$(cast call "$EXEC" 'feeRecipient()(address)' --rpc-url "$LOCAL")" = "0x96F7fb5C4277BD1190fb6eF4820eBC96bA6964A4" ]
          echo "::notice title=Swap executor rehearsal::simulate+broadcast+pins OK on local fork"

  deploy:
    needs: gates
    environment: base-mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT_DIR: deployments/base-mainnet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Solidity dependencies (pinned, same as CI)
        run: |
          mkdir -p .forge-deps
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
          git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Deploy (single broadcast, owner-approved environment)
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
          BASE_MAINNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.SWAP_BASE_MAINNET_DEPLOYER_PRIVATE_KEY }}
          MPGR_SWAP_EXECUTOR_DEPLOY_ENABLED: "true"
          SWAP_EXECUTOR_OWNER: ${{ vars.SWAP_EXECUTOR_OWNER }}
        run: |
          set -euo pipefail
          [ -n "$SWAP_EXECUTOR_OWNER" ] || { echo "::error::SWAP_EXECUTOR_OWNER variable missing in environment base-mainnet"; exit 1; }
          test ! -f "$OUT_DIR/mpgr-swap-executor.json" || { echo "::error::manifest already committed"; exit 1; }
          forge script script/DeployMPGRSwapExecutorBaseMainnet.s.sol:DeployMPGRSwapExecutorBaseMainnet \
            --rpc-url "$BASE_MAINNET_RPC_URL" --broadcast --slow -vv | tee broadcast.txt
          EXEC="$(jq -r .executor "$OUT_DIR/mpgr-swap-executor.json")"
          echo "EXECUTOR=$EXEC" >> "$GITHUB_ENV"
      - name: Independent on-chain verification of governance pins
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
          SWAP_EXECUTOR_OWNER: ${{ vars.SWAP_EXECUTOR_OWNER }}
        run: |
          set -euo pipefail
          retry() { local a out; for a in 1 2 3 4 5 6; do if out="$("$@")"; then printf '%s\n' "$out"; return 0; fi; sleep $((a * 2)); done; echo "::error::RPC call failed: $*" >&2; return 1; }
          R="--rpc-url $BASE_MAINNET_RPC_URL"
          lc() { echo "$1" | tr '[:upper:]' '[:lower:]'; }
          fail() { echo "::error title=Post-deploy check failed::$1"; exit 1; }
          [ "$(retry cast chain-id $R)" = "8453" ] || fail "chain id"
          [ "$(retry cast call "$EXECUTOR" 'feeBps()(uint16)' $R)" = "25" ] || fail "feeBps != 25"
          [ "$(retry cast call "$EXECUTOR" 'MAX_FEE_BPS()(uint16)' $R)" = "100" ] || fail "cap != 100"
          [ "$(retry cast call "$EXECUTOR" 'FEE_TIMELOCK_SECONDS()(uint48)' $R)" = "172800" ] || fail "timelock != 48h"
          [ "$(retry cast call "$EXECUTOR" 'pendingEffectiveAt()(uint48)' $R)" = "0" ] || fail "pending change at birth"
          [ "$(lc "$(retry cast call "$EXECUTOR" 'feeRecipient()(address)' $R)")" = "0x96f7fb5c4277bd1190fb6ef4820ebc96ba6964a4" ] || fail "recipient pin"
          [ "$(lc "$(retry cast call "$EXECUTOR" 'owner()(address)' $R)")" = "$(lc "$SWAP_EXECUTOR_OWNER")" ] || fail "owner != governance multisig"
          echo "::notice title=Swap executor verified on Base Mainnet::$EXECUTOR"
      - name: Source verification (Basescan, only if key present)
        if: ${{ secrets.ETHERSCAN_API_KEY != '' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
        continue-on-error: true
        run: |
          forge verify-contract "$EXECUTOR" contracts/swap/MPGRSwapExecutor.sol:MPGRSwapExecutor --chain 8453 \
            --verifier etherscan --etherscan-api-key "$ETHERSCAN_API_KEY" --watch || true
      - name: Upload manifest artifact + PR comment (activation stays manual)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "<!-- mpgr-swap-executor-base-mainnet -->"
            echo "## MPGR Swap Executor - Base Mainnet (8453)"
            if [ -f "$OUT_DIR/mpgr-swap-executor.json" ]; then
              echo
              echo "Deployed and pin-verified. **Routing is NOT activated**: a human must review"
              echo "this manifest and commit it into lib/swap/swap-executor-config.ts separately."
              echo
              echo '```json'
              jq . "$OUT_DIR/mpgr-swap-executor.json"
              echo '```'
            else
              echo
              echo "Deployment did not complete; nothing was broadcast unless a tx appears above."
            fi
          } > /tmp/swap-summary.md
          cat /tmp/swap-summary.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/swap-summary.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpgr-swap-executor-base-mainnet
          path: |
            deployments/base-mainnet/
            broadcast/DeployMPGRSwapExecutorBaseMainnet.s.sol/8453/run-latest.json
          if-no-files-found: warn
