# REAL Base Sepolia trade through the deployed Vercel Preview MCP endpoint.
# BASE SEPOLIA ONLY. A fresh throwaway wallet is generated in memory inside the job, funded
# with a tiny amount of test ETH from the CI-only deployer key (environment `base-sepolia`),
# and performs quote -> prepare -> sign/send -> receipt -> status -> verify_trade.
# Leftover ETH is swept back. Keys are never printed. See script/e2e-preview-live-trade.mjs.
#
# Trigger: add the `e2e-live-trade-sepolia` label to a PR from this repository. It runs only
# on that label event, never on pushes, so testnet ETH is only spent on request.
name: MCP Preview live trade (Base Sepolia)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  statuses: read
  pull-requests: write
  issues: write

concurrency:
  group: e2e-preview-live-trade
  cancel-in-progress: false

jobs:
  live-trade:
    if: github.event.label.name == 'e2e-live-trade-sepolia' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: base-sepolia
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Wait for the Vercel Preview of this exact commit
        run: |
          for i in $(seq 1 80); do
            STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" --jq '[.[] | select(.context == "Vercel")][0].state // "none"')
            echo "Vercel status for ${HEAD_SHA:0:7}: $STATE"
            case "$STATE" in
              success) exit 0 ;;
              failure|error) echo "::error title=Vercel Preview::Preview for ${HEAD_SHA:0:7} is '$STATE'"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error title=Vercel Preview::Timed out"; exit 1

      - name: Resolve the Preview URL
        run: |
          META=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --jq '[.[] | select(.user.login | test("vercel"; "i")) | .body | select(startswith("[vc]: #"))] | last // ""' | head -1 | sed -E 's/^\[vc\]: #[^:]*://')
          HOST=$(echo "$META" | base64 -d 2>/dev/null | jq -r '.projects[0].previewUrl // empty')
          [ -n "$HOST" ] || { echo "::error title=Preview URL::not found"; exit 1; }
          echo "PREVIEW_URL=https://$HOST" >> "$GITHUB_ENV"

      - name: Real trade via Preview MCP (throwaway wallet)
        id: live
        env:
          FUNDER_PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +e
          node script/e2e-preview-live-trade.mjs
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Report (annotations, summary, PR comment)
        if: always() && hashFiles('e2e-live-results.json') != ''
        run: |
          # Key facts first (one notice), then failures (<= 10 errors).
          jq -r '"::notice title=Live trade facts::" + (.facts | {throwawayWallet, fundingTx, swapTx, swapBlock, intentId, feeRecipientDelta, verified: .verify.verified, sweepTx} | tostring)' e2e-live-results.json
          jq -r '(.results | map(select(.ok)) | length) as $p | (.results | map(select(.ok | not))) as $f | if ($f | length) == 0 then "::notice title=Live trade checks::\($p) passed, 0 failed: " + (.results | map(.name) | join(" | ")) else ($f[0:9][] | "::error title=Live trade FAILED::\(.name) [\(.detail[0:400])]") end' e2e-live-results.json
          cat e2e-live-report.md >> "$GITHUB_STEP_SUMMARY"
          ID=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --jq '[.[] | select(.body | startswith("<!-- mpgr-e2e-live-trade -->"))][0].id // empty')
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@e2e-live-report.md >/dev/null
          else gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@e2e-live-report.md >/dev/null; fi

      - name: Result
        if: always()
        run: exit "${{ steps.live.outputs.status || 1 }}"
