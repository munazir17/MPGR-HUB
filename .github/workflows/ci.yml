name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - run: forge test -vvv

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Install Slither
        run: |
          pip install slither-analyzer==0.11.6
          slither --version
      - name: Test target contracts/ vs .
        run: |
          echo "=== slither . (foundry) ==="
          slither . --filter-paths "openzeppelin|forge-std" 2>&1 | tail -n 100
          echo "exit:$?"
          echo "=== slither contracts/ (solc) ==="
          slither contracts/ --filter-paths "openzeppelin|forge-std" 2>&1 | tail -n 200
          echo "exit:$?"
          echo "=== slither contracts/ with solc remaps ==="
          slither contracts/ --filter-paths "openzeppelin|forge-std" --solc-remaps "@openzeppelin/contracts/=.forge-deps/openzeppelin-contracts/contracts/,forge-std/=.forge-deps/forge-std/src/" 2>&1 | tail -n 200
          echo "exit:$?"
      - name: Test slither-action equivalent
        run: |
          echo "=== action used target contracts/ + checklist + fail-high ==="
          slither contracts/ --filter-paths "openzeppelin|forge-std" --checklist --fail-high 2>&1 | tail -n 300
          echo "exit:$?"
          echo "=== action used target contracts/ + checklist + no-fail-pedantic ==="
          slither contracts/ --filter-paths "openzeppelin|forge-std" --checklist --no-fail-pedantic 2>&1 | tail -n 300
          echo "exit:$?"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-outputs
          path: |
            *.txt
          if-no-files-found: warn
