name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      # Real Uniswap V3 + Permit2 bytecode (pinned) so the Base Sepolia deploy
      # script is dry-run end-to-end in test/script/ instead of skipping.
      - name: Executor ABI in lib/executor is in sync with the contract
        run: node script/gen-executor-abi.mjs --check
      - run: bash script/prepare-uniswap-artifacts.sh
      - run: forge test -vvv
        env:
          MPGR_REQUIRE_UNISWAP_ARTIFACTS: "true"

  contracts-fork:
    # MPGR Executor against the REAL Aerodrome Slipstream router/pools,
    # Uniswap V3, native USDC (EIP-2612) and Permit2 on a LOCAL Base mainnet
    # fork. Nothing is deployed or broadcast to Base mainnet.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Fork tests (Base mainnet fork)
        env:
          # Optional secret for a dedicated RPC; falls back to the public endpoint.
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL || 'https://mainnet.base.org' }}
        run: |
          set -uo pipefail
          forge build >/dev/null
          forge test --match-path 'test/fork/*' --json > fork-results.json 2> fork-stderr.txt
          STATUS=$?
          if [ "$STATUS" != "0" ] && ! jq -e 'type == "object"' fork-results.json >/dev/null 2>&1; then
            echo "::error title=forge test (fork) did not produce results::$(tail -c 1500 fork-stderr.txt | tr '\n' ' ')"
          fi
          # Surface every result as an annotation + step summary (readable without raw logs).
          jq -r '
            to_entries[] | .value.test_results | to_entries[]
            | if .value.status == "Failure" then
                "::error title=\(.key)::\((.value.reason // "failed")) | logs: \((.value.decoded_logs // []) | join(" ; "))"
              elif .value.status == "Skipped" then "::warning title=\(.key)::skipped \((.value.decoded_logs // []) | join(" ; "))"
              else "::notice title=\(.key)::passed \((.value.decoded_logs // []) | join(" ; "))" end
          ' fork-results.json || true
          {
            echo "### Base mainnet fork tests"
            jq -r 'to_entries[] | .value.test_results | to_entries[] | "- \(.value.status): `\(.key)` \(.value.reason // "")"' fork-results.json || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Run Slither analysis
        uses: crytic/slither-action@v0.4.1
        with:
          target: "."
          solc-version: "0.8.24"
          fail-on: high
          slither-args: --filter-paths "openzeppelin|forge-std"
