name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      # Real Uniswap V3 + Permit2 bytecode (pinned) so the Base Sepolia deploy
      # script is dry-run end-to-end in test/script/ instead of skipping.
      - name: Executor ABI in lib/executor is in sync with the contract
        run: node script/gen-executor-abi.mjs --check
      - run: bash script/prepare-uniswap-artifacts.sh
      - name: Assert and record released Foundry and Solidity versions
        run: |
          set -euo pipefail
          FORGE_OUTPUT="$(forge --version)"
          printf '%s\n' "$FORGE_OUTPUT"
          SOLC_VERSION="0.8.24"
          grep -Eq '^[[:space:]]*solc_version[[:space:]]*=[[:space:]]*"0\.8\.24"' foundry.toml || { echo "::error::foundry.toml must pin solc 0.8.24"; exit 1; }
          forge build --force
          SOLC_BIN="$(find "$HOME/.svm" -type f -name "solc-$SOLC_VERSION" -print -quit 2>/dev/null || true)"
          test -n "$SOLC_BIN" && test -x "$SOLC_BIN" || { echo "::error::released solc $SOLC_VERSION binary missing from the Foundry SVM cache"; exit 1; }
          SOLC_OUTPUT="$("$SOLC_BIN" --version)"
          printf '%s\n' "$SOLC_OUTPUT"
          grep -Fq "Version: $SOLC_VERSION+" <<< "$SOLC_OUTPUT" || { echo "::error::Solidity compiler is not the released $SOLC_VERSION build"; exit 1; }
          {
            echo "### Released contracts toolchain"
            echo '```text'
            printf '%s\n' "$FORGE_OUTPUT" "$SOLC_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Released contracts toolchain::$(printf '%s; %s' "$(tr '\n' ' ' <<< "$FORGE_OUTPUT")" "$(tr '\n' ' ' <<< "$SOLC_OUTPUT")")"
      - name: forge test (failure details as annotations)
        env:
          MPGR_REQUIRE_UNISWAP_ARTIFACTS: "true"
        run: |
          set -o pipefail
          forge test -vvv 2>&1 | tee forge-test.log || {
            echo "::error::forge test failed"
            grep -aE "\[FAIL\]|Error:" forge-test.log | head -12 | while IFS= read -r l; do echo "::error::${l:0:500}"; done
            tail -30 forge-test.log | while IFS= read -r l; do echo "::error::TAIL ${l:0:400}"; done
            exit 1
          }

  contracts-fork:
    # MPGR Executor against the REAL Aerodrome Slipstream router/pools,
    # Uniswap V3, native USDC (EIP-2612) and Permit2 on a LOCAL Base mainnet
    # fork. Nothing is deployed or broadcast to Base mainnet.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Fork tests (Base mainnet fork + Base Sepolia deployment)
        env:
          # Optional secret for a dedicated RPC; falls back to a deep-state
          # public endpoint. mainnet.base.org rate-limits shared CI egress
          # (HTTP 429) and serves only minutes of recent state (pruned
          # blocks 404), so the fork tests default to base-rpc.publicnode.com
          # (the same public endpoint the app's RPC fallback chain uses).
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL || 'https://base-rpc.publicnode.com' }}
          # Re-verifies the committed Base Sepolia deployment record against the live chain
          # (test/fork/MPGRExecutorBaseSepoliaDeployment.t.sol). Read-only; nothing is broadcast.
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
        run: |
          set +e -uo pipefail
          forge build >/dev/null
          # Drop stale cross-run FORK caches (restored by the foundry
          # toolchain cache): rpc_storage_caching pins storage to the block
          # captured in a previous run, and short-window public endpoints
          # prune that block within minutes ("block not found: hash …").
          # Only chain-cache subdirs are removed — the Solidity compile
          # cache is preserved.
          rm -rf cache/base cache/base-sepolia cache/8453 cache/84532
          # Public Base RPCs rate-limit shared CI egress IPs (HTTP 429 "over
          # rate limit") under fork load. One settle-and-retry absorbs those
          # transient storms; a real, deterministic failure fails both runs
          # and the job. Storage cached during attempt 1 (rpc_storage_caching
          # in foundry.toml) makes the retry far cheaper on the endpoint.
          forge test --match-path 'test/fork/*' --json > fork-results.json 2> fork-stderr.txt
          STATUS=$?
          if [ "$STATUS" != "0" ]; then
            echo "::warning title=fork suite failed once::retrying after 60s (public Base RPC 429s are transient)"
            sleep 60
            forge test --match-path 'test/fork/*' --json > fork-results.json 2> fork-stderr.txt
            STATUS=$?
          fi
          if [ "$STATUS" != "0" ] && ! jq -e 'type == "object"' fork-results.json >/dev/null 2>&1; then
            echo "::error title=forge test (fork) did not produce results::$(tail -c 1500 fork-stderr.txt | tr '\n' ' ')"
          fi
          # Surface results as annotations + step summary (readable without raw logs).
          # GitHub keeps at most 10 annotations per level per step, so failures get one
          # error each while passes/skips are aggregated into one notice per suite.
          jq -r '
            to_entries[] | .value.test_results | to_entries[] | select(.value.status == "Failure")
            | "::error title=\(.key)::\((.value.reason // "failed")) | logs: \((.value.decoded_logs // []) | join(" ; "))"
          ' fork-results.json || true
          jq -r '
            to_entries[]
            | (.key | split(":") | last) as $suite
            | [.value.test_results | to_entries[]] as $t
            | ([$t[] | select(.value.status == "Success") | .key | sub("\\(\\)$"; "")]) as $p
            | ([$t[] | select(.value.status == "Skipped") | .key | sub("\\(\\)$"; "")]) as $s
            | ([$t[] | select(.value.status == "Failure")] | length) as $f
            | "::\(if $f > 0 then "error" elif ($s | length) > 0 then "warning" else "notice" end) title=\($suite)::\($p | length) passed, \($s | length) skipped, \($f) failed. passed: \($p | join(", ")). skipped: \($s | join(", "))"
          ' fork-results.json || true
          if [ "$STATUS" != "0" ]; then
            # Attach the tail of a full trace for each failing test (logs are not always retrievable).
            for T in $(jq -r 'to_entries[] | .value.test_results | to_entries[] | select(.value.status == "Failure") | .key | sub("\\(.*";"")' fork-results.json 2>/dev/null); do
              forge test --match-path 'test/fork/*' --match-test "^${T}\$" -vvvv > "trace-${T}.txt" 2>&1 || true
              echo "::error title=trace ${T}::$(tail -c 3500 "trace-${T}.txt" | tr '\n' ' ' | sed 's/  */ /g')"
            done
          fi
          {
            echo "### Fork tests (Base mainnet fork + Base Sepolia deployment)"
            jq -r 'to_entries[] | .value.test_results | to_entries[] | "- \(.value.status): `\(.key)` \(.value.reason // "")"' fork-results.json || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Run Slither analysis
        uses: crytic/slither-action@v0.4.1
        with:
          target: "."
          solc-version: "0.8.24"
          fail-on: high
          slither-args: --filter-paths "openzeppelin|forge-std"
