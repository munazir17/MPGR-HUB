name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - run: forge test -vvv

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Install Slither
        run: |
          pip install slither-analyzer==0.11.6
          slither --version
          forge --version
      - name: Run Slither with checklist
        run: |
          echo "Running slither checklist..."
          slither . --filter-paths "openzeppelin|forge-std" --checklist 2>&1 | tee slither-checklist.txt
          echo "Exit code: $?"
      - name: Run Slither JSON output
        run: |
          echo "Running slither json..."
          slither . --filter-paths "openzeppelin|forge-std" --json slither.json 2>&1 | tee slither-log.txt
          echo "Exit code: $?"
          echo "=== JSON ==="
          cat slither.json | head -n 200
          echo "=== detectors ==="
          slither . --filter-paths "openzeppelin|forge-std" --json - 2>&1 | head -n 1000 || true
      - name: Run Slither with fail-on high simulation
        run: |
          echo "Simulating fail-on high: checking for high severity"
          slither . --filter-paths "openzeppelin|forge-std" --fail-pedantic --filter-paths "openzeppelin|forge-std" 2>&1 | tee slither-fail.txt || true
          echo "Now with --fail-high"
          slither . --filter-paths "openzeppelin|forge-std" 2>&1 | tee slither-default.txt
          echo "Exit code: ${PIPESTATUS[0]}"
      - name: Upload Slither artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-debug
          path: |
            slither-checklist.txt
            slither.json
            slither-log.txt
            slither-fail.txt
            slither-default.txt
          if-no-files-found: warn
