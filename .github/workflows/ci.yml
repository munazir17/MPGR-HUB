name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - run: forge test -vvv

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: mkdir -p .forge-deps
      - run: git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .forge-deps/openzeppelin-contracts
      - run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .forge-deps/forge-std
      - name: Check forge and solc
        run: |
          forge --version
          forge build --help | head -n 20
          ls -la .forge-deps/
          cat foundry.toml
      - name: Run Slither via pip (debug)
        run: |
          pip install slither-analyzer==0.11.6
          slither --version
          echo "=== trying slither with foundry ==="
          slither . --filter-paths "openzeppelin|forge-std" --checklist 2>&1 | head -n 500 || true
          echo "=== exit code $? ==="
          echo "=== trying with json ==="
          slither . --filter-paths "openzeppelin|forge-std" --json - 2>&1 | head -n 1000 || true
      - name: Run Slither action (no fail)
        uses: crytic/slither-action@v0.4.1
        id: slither
        continue-on-error: true
        with:
          target: "contracts/"
          solc-version: "0.8.24"
          fail-on: none
          slither-args: --filter-paths "openzeppelin|forge-std"
      - name: Show outputs
        if: always()
        run: |
          echo "sarif path: ${{ steps.slither.outputs.sarif }}"
          ls -la
          cat ${{ steps.slither.outputs.sarif }} 2>&1 | head -n 500 || echo "no sarif"
